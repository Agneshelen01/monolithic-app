name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t monolithic-app .

      - name: Verify Docker image
        run: docker images

      - name: Run test container
        run: docker run -d --name monolithic-app-test -p 5000:5000 monolithic-app

      - name: Check container status and logs
        run: |
          sleep 5
          docker ps -a
          docker logs monolithic-app-test

      - name: Test application
        run: curl --fail http://localhost:5000/

      - name: Stop test container
        run: docker stop monolithic-app-test
